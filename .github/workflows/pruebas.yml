# Pipeline de pruebas: contrato → (api ∥ web) → reportes → publicar (GitHub Pages).
# Quality gate (job reportes, `reportes.py gate`): G1 contrato 0 fallos · G2 API sin fallas inesperadas ni XPASS
# (@DEF-nn = xfail estricto) · G3 cobertura ≥ 60 % (meta 75 %) · G4 web 3/3 corridas, @ia pasa, DEF-14 falla ·
# G5 toda HU del alcance con caso ejecutado · G6 pruebas ≤ 10 min. El sitio se publica también con el gate en rojo.
# Reportes: https://maykol-morales.github.io/cs5383-qolqe-wallet/  (matriz, Allure API/web, Schemathesis)
name: Pruebas

on:
  push:
    branches: [main, parte-1, parte-2, final]
    tags: ["parte-*", "final"]
  pull_request:
  workflow_dispatch:
    inputs:
      evidencia:
        description: "Evidencia en los reportes Allure: fallos (captura del paso web que falló), todo (captura de cada paso web), no (sin imágenes ni adjuntos HTTP)"
        type: choice
        options: [fallos, todo, no]
        default: fallos

permissions:
  contents: read

# La leen tests/api/conftest.py (adjuntos HTTP) y tests/e2e/wdio.conf.js (capturas). Push y PR: fallos.
env:
  EVIDENCIA: ${{ inputs.evidencia || 'fallos' }}

jobs:
  # Primero el contrato: es la verificación más amplia y barata (todas las operaciones del OpenAPI) y la única
  # ejecución de Schemathesis. Si la API no cumple su contrato (5xx, estados, esquemas), no se corre lo demás.
  contrato:
    name: Contrato OpenAPI (Schemathesis CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { PYTHONUTF8: "1", BROWSER: "true" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - name: Instalar
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt

      # --seed 1: mismos casos en cada run. Deja HTML, VCR + HAR (cada petición/respuesta, base del dashboard
      # de contrato que arma el job api) y JUnit (trazabilidad). El código de salida es el gate.
      - name: Schemathesis CLI
        run: .venv/bin/python demo.py schemathesis

      - name: Resumen
        if: ${{ !cancelled() }}
        run: |
          mv reporte-schemathesis/html-* reporte-schemathesis/html   # runner limpio: un solo html-*
          python .github/scripts/reportes.py resumen "Contrato OpenAPI (Schemathesis CLI)" reporte-schemathesis/junit-contrato.xml >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: contrato, path: reporte-schemathesis/ }

  api:
    name: API (pytest-bdd)
    needs: contrato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { PYTHONUTF8: "1" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - uses: actions/setup-node@v5   # npx allure (Allure 3, sin Java)
        with: { node-version: "22" }

      # .venv en la raíz: demo.py busca sus herramientas allí
      - name: Instalar
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt

      # Humo + BDD (núcleo y G3). Los @DEF-nn salen xfailed; si un defecto se corrige pasa a XPASS y el job falla (strict).
      - name: pytest
        run: >
          .venv/bin/python -m pytest -rx --junitxml=reportes/junit-api.xml
          --alluredir=reportes/allure-results --cov=qolqe --cov-report=xml:reportes/cobertura.xml --cov-report=term

      # Dashboard de contrato: los casos del job contrato (VCR + HAR) frente a las peticiones de cada escenario BDD
      # (adjuntos Allure), para ver qué escenarios repiten lo que ya comprobó Schemathesis. BROWSER=true: no abre nada.
      # Con EVIDENCIA=no no hay adjuntos HTTP y se omite.
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && env.EVIDENCIA != 'no' }}
        with: { name: contrato, path: reporte-schemathesis }
      - name: Dashboard de contrato
        if: ${{ !cancelled() && env.EVIDENCIA != 'no' }}
        env: { BROWSER: "true" }
        run: .venv/bin/python demo.py dashboard

      - name: Reporte Allure
        if: ${{ !cancelled() }}
        run: npx -y allure@3.21.0 generate --clean reportes/allure-results

      - name: Resumen
        if: ${{ !cancelled() }}
        run: python .github/scripts/reportes.py resumen "API (pytest-bdd)" reportes/junit-api.xml >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: api, path: reportes/ }

  web:
    name: Web E2E (WebdriverIO, 3 corridas)
    needs: contrato
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: tests/e2e }
    env:
      QOLQE_URL: http://localhost:8000
      ANTHROPIC_API_KEY: ""   # sin secretos: @ia repite browser.act desde la caché commiteada (0 tokens)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/e2e/package-lock.json }

      - name: Instalar
        run: |
          python -m venv ../../.venv && ../../.venv/bin/pip install -q -r ../../requirements.txt
          npm ci

      - name: Levantar Qolqe
        working-directory: .
        run: |
          QOLQE_MODO_PRUEBA=1 QOLQE_BD="$RUNNER_TEMP/qolqe.db" nohup .venv/bin/python -m uvicorn qolqe.main:app --port 8000 \
            > "$RUNNER_TEMP/qolqe.log" 2>&1 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 localhost:8000/api/salud || { cat "$RUNNER_TEMP/qolqe.log"; exit 1; }

      # "Pasa 3 veces seguidas": cada corrida parte de datos semilla (beforeScenario reinicia Qolqe).
      # El reporter JUnit siempre escribe en reportes/junit/e2e-<cid>.xml: se aparta tras cada corrida.
      # Una corrida fallida no corta las demás (el gate G4 cuenta k/3); el paso falla al final.
      - name: E2E × 3 (npm test)
        run: |
          fallo=0
          for i in 1 2 3; do
            echo "::group::Corrida $i"
            npm test || { fallo=1; echo "::error::Corrida $i falló"; }
            mv reportes/junit reportes/junit-corrida-$i 2>/dev/null || mkdir -p reportes/junit-corrida-$i  # sin JUnit = corrida ❌ en G4
            echo "::endgroup::"
          done
          exit $fallo

      # !cancelled(): corren aunque falle una corrida, para que G4 informe su resultado real.
      - name: Escenario @ia desde la caché (npm run test:ia)
        if: ${{ !cancelled() }}
        run: npm run test:ia && mv reportes/junit reportes/junit-ia

      # DEF-14 debe fallar mientras exista, como un xfail estricto de pytest: si pasa, el defecto se corrigió
      # y el job falla para retirar @DEF-14. Se invierte en vez de continue-on-error para que una corrección
      # no pase inadvertida; el grep exige que la falla sea del escenario (un error al lanzar Chrome no deja
      # <failure> en el JUnit). Sus resultados Allure se apartan (el reporte web muestra en rojo solo lo
      # inesperado); su JUnit sí va a la matriz, como "defecto conocido".
      - name: DEF-14 (falla esperada)
        if: ${{ !cancelled() }}
        run: |
          mv reportes/allure-results reportes/allure-results-ok
          if npm run test:defectos; then echo "::error::DEF-14 pasó: el defecto se corrigió, retirar @DEF-14"; exit 1; fi
          grep -q '<failure' reportes/junit/*.xml
          mv reportes/junit reportes/junit-def14
          rm -rf reportes/allure-results && mv reportes/allure-results-ok reportes/allure-results

      - name: Reporte Allure
        if: ${{ !cancelled() }}
        run: npm run reporte

      - name: Resumen
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          shopt -s nullglob
          python .github/scripts/reportes.py resumen "Web E2E (3 corridas + @ia)" tests/e2e/reportes/junit-{corrida-*,ia}/*.xml tests/e2e/reportes/junit/*.xml >> "$GITHUB_STEP_SUMMARY"
          python .github/scripts/reportes.py resumen "Web E2E · DEF-14 (falla esperada)" tests/e2e/reportes/junit-def14/*.xml >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web
          path: |
            tests/e2e/reportes/
            tests/e2e/evidencia/

  reportes:
    name: Quality gate y sitio
    needs: [contrato, api, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # continue-on-error: si el contrato falló, api y web no corren y no dejan artefacto; el sitio sale igual
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: contrato, path: reporte-schemathesis }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: api, path: reportes }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: web, path: tests/e2e }

      # docs/trazabilidad.md (HU → caso → nivel → resultado) + sitio/ con portada, matriz y reportes
      - name: Matriz y sitio
        run: python .github/scripts/reportes.py sitio sitio >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: trazabilidad
          path: |
            docs/trazabilidad.md
            sitio/
      - uses: actions/upload-pages-artifact@v4
        with: { path: sitio }

      # Al final: el sitio ya se subió, así Pages muestra el estado real aunque el gate quede en rojo.
      - name: Quality gate
        run: python .github/scripts/reportes.py gate >> "$GITHUB_STEP_SUMMARY"

  # Despliegue aparte: el environment github-pages solo se usa al publicar (push a parte-2/main/final o manual),
  # así los PR y las demás ramas no chocan con sus reglas de protección. Publica también si el gate falló
  # (reportes en failure): el sitio muestra el gate en rojo en vez de quedarse con el último verde.
  publicar:
    name: Publicar en GitHub Pages
    needs: reportes
    if: ${{ !cancelled() && (needs.reportes.result == 'success' || needs.reportes.result == 'failure') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/parte-2' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/final'))) }}
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
