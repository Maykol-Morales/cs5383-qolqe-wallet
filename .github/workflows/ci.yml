name: CI

on:
  push:
    branches: [main, "parte-*"]
    tags: ["parte-*", "final"]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas-api:
    name: Pruebas de API y contrato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Humo + BDD (núcleo y G3) + contrato Schemathesis. Los defectos conocidos (@DEF-nn)
      # salen como xfailed (-rx los lista); si se corrigen pasan a XPASS y el job falla (strict).
      - name: Ejecutar pruebas
        run: >
          pytest -rx --junitxml=reportes/junit.xml --alluredir=reportes/allure-results
          --cov=qolqe --cov-report=xml:reportes/cobertura.xml --cov-report=term

      # Dashboard Allure 3 (allurerc.mjs) en reportes/allure/index.html, dentro del artefacto
      - name: Reporte Allure
        if: always()
        run: npx -y allure@3.21.0 generate --clean reportes/allure-results

      - name: Resumen
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse("reportes/junit.xml").getroot()
          r = r if r.tag == "testsuite" else r[0]
          print("### Resultado de las pruebas")
          print(f"- Pruebas: {r.get('tests')} · fallos: {r.get('failures')} · errores: {r.get('errors')} · omitidas/xfail: {r.get('skipped')}")
          print("- Defectos conocidos: docs/defectos.md")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes
          path: reportes/

  # Parte 2: WebdriverIO + Cucumber en tests/e2e/ (README de esa carpeta). En Windows y Linux
  # porque ahí aparecieron las condiciones de carrera; en Windows también se ensaya npm run demo.
  pruebas-web:
    name: Pruebas web E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      - name: Instalar
        run: |
          python -m venv ../../.venv
          PY=../../.venv/bin/python; [ -f ../../.venv/Scripts/python.exe ] && PY=../../.venv/Scripts/python.exe
          $PY -m pip install -r ../../requirements.txt
          npm ci

      - name: npm test contra Qolqe
        run: |
          cd ../..   # qolqe/ está en la raíz
          PY=.venv/bin/python; [ -f .venv/Scripts/python.exe ] && PY=.venv/Scripts/python.exe
          $PY -m uvicorn qolqe.main:app --port 8000 &
          cd tests/e2e
          until curl -sf localhost:8000/api/salud; do sleep 1; done
          npm test

      - name: Reporte Allure
        if: always()
        run: npm run reporte

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-web-${{ matrix.os }}
          path: tests/e2e/reportes/allure/index.html

      # npm run demo: Qolqe propio, flujo con ventana, mutación que falla y reporte.
      - name: npm run demo (Windows)
        if: runner.os == 'Windows'
        env: { CI: 'true' }
        run: |
          taskkill //F //IM python.exe || true
          printf "\n%.0s" 1 2 3 4 5 | npm run demo
          git diff --exit-code features/
          ls evidencia/*.png reportes/allure/index.html

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: demo-web-windows
          path: |
            tests/e2e/evidencia/
            tests/e2e/reportes/qolqe.log
            tests/e2e/reportes/allure/index.html
